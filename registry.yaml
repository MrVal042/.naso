name: NASO
version: 1.0.0

description: >
  Next-generation AI Software Operations.
  A hierarchical engineering operating system for AI-assisted software development.

entrypoint: context.md

constitution:
  file: NASO.md
  required: true

priority:
  - NASO.md
  - context.md
  - standards/*
  - playbooks/*
  - repository/AGENTS.md

routing:
  architecture:
    files:
      - architecture/architecture.md

  engineering:
    files:
      - standards/engineering.md

  coding:
    files:
      - standards/coding.md

  testing:
    files:
      - standards/testing.md

  documentation:
    files:
      - standards/documentation.md

  review:
    files:
      - standards/review.md

  bugfix:
    files:
      - playbooks/bug-fix.md

  feature:
    files:
      - playbooks/new-feature.md

  refactor:
    files:
      - playbooks/refactor.md

  release:
    files:
      - playbooks/release.md

  incident:
    files:
      - playbooks/incident.md

  prompts:
    directory: prompts/

  workflows:
    directory: workflows/

  templates:
    directory: templates/

  scripts:
    directory: scripts/

quality:
  priorities:
    - correctness
    - simplicity
    - maintainability
    - consistency
    - performance

rules:
  inspect_before_edit: true
  reuse_before_create: true
  smallest_safe_change: true
  evidence_over_assumptions: true
  repository_instructions_extend_naso: true

completion:
  require_validation: true
  identify_remaining_risks: true
  update_documentation_when_needed: true

bootstrap:
  continue: bootstrap/continue.md
  cursor: bootstrap/cursor.md
  copilot: bootstrap/copilot.md
  claude: bootstrap/claude.md
  codex: bootstrap/codex.md
  aider: bootstrap/aider.md
  antigravity: bootstrap/antigravity.md
